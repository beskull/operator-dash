app = "operator-dash-renderer"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

# WebSockets need a machine that stays warm — no scale-to-zero here.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
